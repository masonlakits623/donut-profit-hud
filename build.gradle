plugins {
	// Loom 1.17.x is the newest line that still runs on a Java 21 JDK (1.18+ needs Java 25).
	id 'fabric-loom' version "${loom_version}"
}

base {
	archivesName = 'donut-profit-hud'
}

repositories {
	mavenCentral()
}

// Dev-only: a tiny helper mod that stages scenes and saves screenshots for the mod pages.
// It is never packed into the release jar (only sourceSets.main is).
sourceSets {
	demo {
		compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
		runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
	}
}

loom {
	mods {
		"donutprofithud" {
			sourceSet sourceSets.main
		}
		"donutprofithud_demo" {
			sourceSet sourceSets.demo
		}
	}
	runs {
		demo {
			client()
			name = "Demo screenshots"
			source sourceSets.demo
			runDir "run-demo"
			programArgs "--width", "1920", "--height", "1080"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

test {
	useJUnitPlatform()
	testLogging {
		events "passed", "failed", "skipped"
		exceptionFormat "full"
	}
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}
